<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #weather-widget {
            width: 300px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        #temp {
            font-size: 48px;
            font-weight: 300;
            margin: 0;
        }
        #details {
            margin-top: 15px;
            font-size: 16px;
        }
        #details div {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="weather-widget">
        <div id="temp">--°C</div>
        <div id="details">
            <div id="precip">--% chance of rain</div>
            <div id="wind">-- km/h wind</div>
        </div>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
